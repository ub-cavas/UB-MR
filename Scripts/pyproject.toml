[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ub-experiment-logging"
version = "0.1.0"
description = "Client-independent experiment recording and graphs for UB Digital Twin"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]

[project.scripts]
ub-experiment-plot = "ub_experiment.plot:main"

[tool.setuptools.packages.find]
include = ["ub_experiment*"]
